spring:
  datasource:
    # Simulamos PostgreSQL en memoria
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Crea las tablas al iniciar el test y las borra al final
    properties:
      hibernate:
        format_sql: true

  # Opcional: Si Liquibase falla con H2, puedes desactivarlo en tests
  liquibase:
    enabled: true
    change-log: src/main/resources/db/changelog/db.changelog-master.xml
    default-schema: tuxtepec
    liquibase-schema: public
