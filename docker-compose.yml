services:
  ms-padron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-padron-app

    restart: always

    ports:
      - "8081:8080"

    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${PROFILE_SPRING}
      # Conexión DB
      - URL_BD_PADRON=${URL_BD_PADRON}
      - USER_NAME_BD=${USER_NAME_BD}
      - PASSWORD_BD=${PASSWORD_BD}
      # Seguridad Keycloak
      - ISSUER_URI_KEYCLOAK=${ISSUER_URI_KEYCLOAK}
      - JWK_SET_URI_KEYCLOAK=${JWK_SET_URI_KEYCLOAK}
      # PostGIS y Hibernate
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver

      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - EUREKA_URI=${EUREKA_URI}

    # Configuración de red
    networks:
      - siim-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres-db:
        condition: service_healthy

# Definimos la red
networks:
  siim-network:
    name: siim-global-net
    external: true